[package]
name = "vector-llm-bot"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Vector LLM Bot"]

[dependencies]
vector_sdk = "0.2.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
dotenvy = "0.15"
url = "2.5"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
hex = "0.4"

# Optional: small CLI helper for local testing flows (not required for the SDK usage)
# clap = { version = "4", features = ["derive"] }